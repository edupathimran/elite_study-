{% extends "layout.html" %}
{% block title %}ELITE STUDY — Apna Naam Daalein{% endblock %}

{% block content %}
<div class="min-h-[82vh] flex items-center justify-center">
  <div class="w-full max-w-md day-surface rounded-3xl p-6 sm:p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 text-emerald-400 flex items-center justify-center font-extrabold text-lg">
        ES
      </div>
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">ELITE STUDY</h1>
        <p class="text-xs text-emerald-700 font-bold">Class 10 Lectures & PDF Notes</p>
      </div>
    </div>

    <p class="text-sm text-slate-600 leading-relaxed mb-6">
      Portal mein aage badhne ke liye sirf apna <span class="text-slate-900 font-bold">naam</span> daalein.
    </p>

    <form method="POST" action="{{ url_for('entry') }}" class="space-y-4">
      <div>
        <label for="studentName" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
          Aapka Naam *
        </label>
        <input id="studentName" name="name" type="text" required autofocus
          placeholder="Jaise: Aarav Sharma"
          class="w-full px-4 py-3.5 rounded-2xl bg-[#f8f7f4] border border-slate-900/15 focus:border-emerald-600 focus:bg-white focus:outline-none text-slate-900 text-sm">
      </div>

      <button type="submit"
        class="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-emerald-700 text-white font-extrabold text-sm transition cursor-pointer">
        Continue to Dashboard →
      </button>
    </form>
  </div>
</div>
{% endblock %}
